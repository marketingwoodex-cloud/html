<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Woodex Admin v2.5 Pro — Master Dashboard</title>
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong palette. Mirrors the token contract in src/styles/tokens.css.
      try {
        var t = localStorage.getItem("wx.theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var d = localStorage.getItem("wx.density") || "comfortable";
        var a = localStorage.getItem("wx.accent") || "brand";
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.density = d;
        document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Boot guard. This page has exactly one failure mode that shows nothing at all: the module graph
      never runs (an asset 404, a wrong base path, a MIME type the browser refuses, a syntax error in
      the entry chunk). React never mounts, so React cannot report it, and the tab is a white screen
      with an empty console — the state this console is designed never to be in.

      The check is deliberately narrow, so that it can never paper over a real result: it paints only
      when #root is still empty after the page has finished loading. Any screen — a list, a sign-in
      form, a data-state message, a crash report — fills #root, and is then left alone.

      The one thing it repairs: a page served at the wrong address. The console's assets and its router
      both live under `/admin-next/`, so an `index.html` reached at any other path (a dev server without
      its base, a hand-copied file, a rewrite that forgot the prefix) would render nothing — the module
      runs, the router finds no route under a mount it does not own, and the tab stays empty. Rather than
      leaving that to be diagnosed, the guard notices it and says where the console is.
    -->
    <script>
      (function () {
        /* Keep in step with `base` in vite.config.ts; this is the built page, so it is the built value. */
        var MOUNT = "/admin-next/";
        var mounted =
          location.pathname === MOUNT.slice(0, -1) || location.pathname.indexOf(MOUNT) === 0;

        function report(why, href) {
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;' +
            'font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif">' +
            '<div style="max-width:640px">' +
            '<div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.65">' +
            "Woodex Admin v2.5 · wrong address</div>" +
            '<h1 style="font-size:20px;margin:8px 0 6px">The console is at /admin-next/.</h1>' +
            '<p style="margin:0 0 12px;opacity:.85">This page was opened at <code></code>, which is not where ' +
            "the console is mounted — so its own router has nothing to match and would show nothing at all. " +
            "Nothing has been read or written, and nothing is wrong with your data.</p>" +
            '<pre style="margin:0 0 12px;padding:12px;overflow:auto;background:#f6f7f9;' +
            'border:1px solid #e4e7ec;border-radius:8px;font-size:12px"></pre>' +
            "</div></div>";
          root.querySelector("code").textContent = location.pathname;
          root.querySelector("pre").textContent = why;
          if (href) {
            var a = document.createElement("a");
            a.href = href;
            a.textContent = "Open " + href;
            a.style.cssText = "display:inline-block;padding:8px 14px;border:1px solid #e4e7ec;border-radius:8px;text-decoration:none;color:inherit";
            root.querySelector("div div").appendChild(a);
          }
          console.error("[wx] console opened outside its mount point:", location.pathname);
        }

        /* A failed <script>/<link> fires a resource error event that does not bubble. */
        window.addEventListener(
          "error",
          function (ev) {
            var t = ev.target;
            if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
              report("Failed to load " + (t.src || t.href) + (t.tagName === "LINK" ? " (stylesheet)" : ""));
            }
          },
          true
        );

        /* Network-level failure of the entry chunk reaches window.onerror with a message only. */
        window.addEventListener("error", function (ev) {
          if (ev.target === window && ev.message) report(ev.message);
        });

        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!mounted) {
              report(MOUNT + " is where the console's routes and assets are served from.", MOUNT);
              return;
            }
            report("The entry module did not execute. Check the browser network tab for the JS chunk.");
          }, 4000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
